name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Two pushes landing close together would otherwise race each other onto gh-pages and the
# loser's dist would win. Queue instead of cancelling: a cancelled run can leave a partially
# written publish branch, and the pipeline is cheap enough to just let both finish in order.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cold-cache worst case is a ~117 MB model download plus a headless Chrome pass over every
    # route. 45 minutes is generous for that; the point is that a wedged browser cannot sit
    # on the runner for the default six hours.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate-sitemap.js derives <lastmod> from "git log -1" per component; a shallow
          # clone has no history, so every URL would collapse to the build date.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # scripts/prerender.js drives a real Chrome, and a missing browser is a hard build
      # failure by design (shipping an un-prerendered dist silently is the exact bug this
      # pipeline exists to prevent). puppeteer's postinstall downloads ~150 MB of Chrome into
      # ~/.cache/puppeteer during `npm ci`; caching that turns the download into a restore.
      # Keyed on the lockfile because that is what pins the puppeteer version, and therefore
      # which Chrome build it resolves.
      - name: Cache Chrome for Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      # scripts/copy-ocr-assets.js fetches the background-removal ONNX model (~117 MB) from
      # staticimgly.com and keeps it under .imgly-cache, keyed by library version, so a warm
      # cache makes the prebuild fully offline. A miss is not fatal — that script catches the
      # failure and the tool falls back to the CDN at runtime — but it costs minutes of build
      # time and a lot of third-party bandwidth on every single deploy.
      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: .imgly-cache
          key: ${{ runner.os }}-imgly-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-imgly-

      - name: Install dependencies
        run: npm ci

      # Belt and braces. `npm ci` normally installs Chrome via puppeteer's postinstall, but a
      # future `ignore-scripts`, a partially populated browser cache, or an npm-cache-only hit
      # would leave no binary — and scripts/prerender.js would then fail the whole deploy.
      # Idempotent: @puppeteer/browsers returns early when the pinned build already exists in
      # the cache directory, so on a warm cache this downloads nothing.
      - name: Ensure Chrome for Puppeteer is installed
        run: npx puppeteer browsers install chrome

      # ONE command, byte-identical to what a developer runs locally, so CI and local can
      # never drift again. package.json owns the order; do not inline the stages here.
      #
      #   npm run prepare-deploy
      #     1. npm run validate-routes   App.jsx routes == generate-sitemap.js routes
      #     2. npm run build
      #          prebuild:  scripts/copy-ocr-assets.js    -> public/tesseract, public/imgly
      #                     scripts/copy-monaco-assets.js -> public/monaco/vs
      #          vite build                               -> dist/ (publicDir copied verbatim)
      #          postbuild: scripts/prune-dead-assets.js  -> drops unreachable ORT wasm
      #     3. node generate-sitemap.js  -> one dist/<route>/index.html per route, sitemap.xml,
      #                                     .nojekyll, 404.html
      #     4. npm run prerender         -> fills every dist/<route>/index.html #root
      #
      # Step 4 is the one CI used to skip entirely, which is why every deploy before this
      # shipped `<div id="root"></div>` to crawlers. PRERENDER_OPTIONAL is deliberately NOT
      # set: a missing browser must fail the build, not quietly downgrade the output.
      - name: Lint
        run: npm run lint

      - name: Build, generate sitemap and prerender
        run: npm run prepare-deploy

      # Gate the publish on the artifacts actually being there. Every assertion below maps to
      # a way this pipeline has silently produced a deployable-but-wrong dist.
      - name: Verify deployment structure
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "❌ ERROR: $*" >&2; exit 1; }

          echo "── Critical files ───────────────────────────────────────────"
          for f in dist/index.html dist/.nojekyll dist/404.html dist/og/default.png dist/sitemap.xml; do
            [ -f "$f" ] || fail "$f is missing"
            echo "   ✓ $f"
          done

          echo "── Route pages ──────────────────────────────────────────────"
          # How many there should be is DERIVED, never typed here. validate-routes.js --count
          # parses the authoritative route list out of src/App.jsx, cross-checks it against
          # generate-sitemap.js (the same check prepare-deploy runs as its first step) and
          # prints the total. Adding a tool therefore moves this gate on its own.
          #
          # This used to be a hard-coded `-ge 89` floor, and it rotted: with the site at 112
          # routes, every route added after the number was written could vanish from dist and
          # the gate still passed. It is now a per-route SET check (below), because even an
          # equality count cannot see a route that went missing while another appeared.
          expected_routes=$(node scripts/validate-routes.js --count)
          case "$expected_routes" in
            ''|*[!0-9]*) fail "validate-routes.js --count printed '$expected_routes', which is not a number" ;;
          esac
          echo "   src/App.jsx declares $expected_routes routes"
          # SET comparison, not a count: every route App.jsx declares must have its own
          # dist/<route>/index.html. A count is blind to a rename — one route vanishing while
          # another appears leaves the total unchanged; checking each path by name cannot miss it.
          # A read loop rather than `mapfile` so this block stays runnable on macOS bash 3.2 too.
          missing=0
          while IFS= read -r route; do
            if [ "$route" = "/" ]; then page="dist/index.html"; else page="dist${route}/index.html"; fi
            if [ ! -f "$page" ]; then echo "   MISSING: $page"; missing=$((missing + 1)); fi
          done < <(node scripts/validate-routes.js --list)
          [ "$missing" -eq 0 ] || fail "$missing declared route(s) have no index.html in dist"
          pages=()
          while IFS= read -r page; do
            pages+=("$page")
          done < <(find dist \( -name assets -o -name '.*' \) -prune -o -type f -name index.html -print | sort)
          echo "   found ${#pages[@]} route index.html files, all $expected_routes declared routes present"
          [ "${#pages[@]}" -eq "$expected_routes" ] || fail "dist holds ${#pages[@]} route pages but App.jsx declares $expected_routes — extra/orphan pages in the artifact"

          echo "── Prerendered markup ───────────────────────────────────────"
          # Two complementary checks, because either alone has a blind spot.
          #
          # 1. The exact literal from prerender.js's EMPTY_ROOT constant — byte-for-byte what
          #    index.html ships and what generate-sitemap.js copies into every route. Kept as a
          #    fixed string rather than a whitespace-tolerant regex: grep is line-oriented, so a
          #    regex that looks like it spans newlines quietly would not.
          empty_root=$(grep -lF '<div id="root"></div>' "${pages[@]}" || true)
          if [ -n "$empty_root" ]; then
            echo "$empty_root" | sed 's/^/     /'
            fail "the pages above still ship an empty <div id=\"root\"></div> — prerender did not run or did not cover them"
          fi
          #
          # 2. Positive proof that real content landed, which also covers the degenerate roots
          #    the literal above cannot see (whitespace-only, spinner-only, truncated). Sound in
          #    both directions: the SPA shell and dist/404.html contain no <h1 at all, and
          #    prerender.js already hard-fails any route that renders without one.
          no_heading=$(grep -LF '<h1' "${pages[@]}" || true)
          if [ -n "$no_heading" ]; then
            echo "$no_heading" | sed 's/^/     /'
            fail "the pages above contain no <h1> — their prerendered body is empty or degenerate"
          fi
          echo "   ✓ all ${#pages[@]} route pages carry a filled #root and an <h1>"

          echo "── Self-hosted Monaco ───────────────────────────────────────"
          # src/utils/monacoLoader.js repoints @monaco-editor/loader at /monaco/vs. If that
          # payload is absent the Monaco-backed editor routes silently fall back to cdn.jsdelivr.net,
          # the off-origin dependency this site no longer carries.
          [ -f dist/monaco/vs/loader.js ] || fail "dist/monaco/vs/loader.js missing — editor routes would fall back to cdn.jsdelivr.net"
          [ -f dist/monaco/vs/editor/editor.main.js ] || fail "dist/monaco/vs/editor/editor.main.js missing — the Monaco copy is incomplete"
          monaco_files=$(find dist/monaco/vs -type f | wc -l | tr -d ' ')
          # `du -sk` rather than `find -printf`/`stat`: identical on GNU and BSD, so this block
          # is runnable off-CI. Block rounding only ever overstates, which for a floor check is
          # slack measured in hundreds of KB against a multi-MB threshold.
          monaco_kb=$(du -sk dist/monaco/vs | awk '{ print $1 }')
          echo "   found $monaco_files files, $((monaco_kb / 1024)) MB"
          # 108 files / ~14.7 MB at monaco-editor 0.55.1. The floors leave room for the package
          # to shrink while still catching an absent or truncated copy.
          [ "$monaco_kb" -ge 12288 ] || fail "Monaco payload is only $((monaco_kb / 1024)) MB (expected ~14 MB) — copy-monaco-assets.js did not stage it"
          [ "$monaco_files" -ge 90 ] || fail "Monaco payload has only $monaco_files files (expected ~108) — the copy is incomplete"

          echo "── Sitemap ──────────────────────────────────────────────────"
          # Same derived number as the route-page gate above: generate-sitemap.js emits one
          # <loc> per route, so anything other than equality means a route is unlisted or
          # listed twice.
          loc_count=$( { grep -o '<loc>' dist/sitemap.xml || true; } | wc -l | tr -d ' ')
          echo "   found $loc_count <loc> entries"
          [ "$loc_count" -eq "$expected_routes" ] || fail "dist/sitemap.xml has $loc_count <loc> entries, expected $expected_routes"

          # Every *.html the deploy publishes, not just the route pages: dist/404.html is served
          # for a mis-typed URL and is just as capable of shipping a bad link or a stale icon tag.
          html_files=()
          while IFS= read -r f; do
            html_files+=("$f")
          done < <(find dist -name assets -prune -o -type f -name '*.html' -print | sort)
          [ "${#html_files[@]}" -gt 0 ] || fail "no .html files found under dist — nothing to verify"

          echo "── Internal links keep their trailing slash ─────────────────"
          # Every route is published as a directory index, so /merge-pdf answers with a 301 to
          # /merge-pdf/ and an internal link written without the slash spends a redirect — and
          # splits crawl signals across two URLs — on every single click. The forbidden forms are
          # DERIVED from src/App.jsx, so a route added tomorrow is covered without touching this file.
          #
          # The route list is materialised first and checked. `node ... | while read` inside a process
          # substitution hides a non-zero exit, and `grep -F -f` with an EMPTY pattern file matches
          # nothing on GNU grep — so a broken route list would turn this whole gate into a green no-op.
          route_list=$(mktemp)
          node scripts/validate-routes.js --list > "$route_list" || fail "scripts/validate-routes.js --list failed; the route-derived link gate cannot run"
          route_total=$(wc -l < "$route_list" | tr -d ' ')
          [ "$route_total" -ge 2 ] || fail "validate-routes.js --list printed $route_total route(s); the link gate would check nothing"

          link_patterns=$(mktemp)
          while IFS= read -r route; do
            if [ "$route" = "/" ]; then continue; fi
            printf 'href="%s"\n' "$route"
            printf 'href="%s?\n' "$route"
            printf 'href="%s#\n' "$route"
          done < "$route_list" > "$link_patterns"
          non_root=$( { grep -c -v '^/$' "$route_list" || true; } | tr -d ' ')
          pattern_total=$(wc -l < "$link_patterns" | tr -d ' ')
          [ "$pattern_total" -eq $(( non_root * 3 )) ] || fail "derived $pattern_total link patterns from $non_root non-root routes, expected $(( non_root * 3 ))"
          echo "   $pattern_total forbidden link forms derived from $route_total routes in src/App.jsx"
          bad_links=$( { grep -o -H -F -f "$link_patterns" "${html_files[@]}" || true; } | sort -u)
          if [ -n "$bad_links" ]; then
            echo "$bad_links" | sed 's/^/     /'
            fail "$(echo "$bad_links" | wc -l | tr -d ' ') slash-less internal link(s) above — write the route with its trailing slash"
          fi
          echo "   ✓ no slash-less internal links in any published page"

          # The scan above only sees links that are in the markup at prerender time. A <Link> behind a
          # tab, a modal or a conditional never reaches the HTML, so check the source for the same forms.
          src_patterns=$(mktemp)
          while IFS= read -r route; do
            if [ "$route" = "/" ]; then continue; fi
            printf 'to="%s"\n' "$route"
            printf 'href="%s"\n' "$route"
          done < "$route_list" > "$src_patterns"
          [ -s "$src_patterns" ] || fail "derived no source link patterns from $route_list"
          bad_src=$(grep -r -n -H -F -f "$src_patterns" --include='*.jsx' --include='*.js' src || true)
          if [ -n "$bad_src" ]; then
            echo "$bad_src" | cut -c1-160 | sed 's/^/     /'
            fail "$(echo "$bad_src" | wc -l | tr -d ' ') source line(s) above link to a route without its trailing slash"
          fi
          echo "   ✓ no slash-less route links in src"

          echo "── Icon set ─────────────────────────────────────────────────"
          # These three live at fixed addresses that browsers and crawlers request whether or not the
          # markup declares them. When they 404, mobile search results fall back to a generic globe.
          for f in dist/favicon.ico dist/apple-touch-icon.png dist/site.webmanifest; do
            [ -s "$f" ] || fail "$f is missing or empty — public/ did not stage the icon set"
            echo "   ✓ $f ($(wc -c < "$f" | tr -d ' ') bytes)"
          done
          # A manifest that does not parse, or that points at icons the build never emitted, is worse
          # than no manifest: the browser reports an install error instead of silently using the favicon.
          node - <<'JS' || fail "dist/site.webmanifest is unusable — see the lines above"
          const fs = require('fs');
          const path = require('path');
          const file = 'dist/site.webmanifest';
          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error(`     ${file} is not valid JSON: ${error.message}`);
            process.exit(1);
          }
          const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
          if (icons.length === 0) {
            console.error(`     ${file} declares no icons[] — nothing to install with`);
            process.exit(1);
          }
          let bad = 0;
          for (const icon of icons) {
            const src = icon && icon.src;
            if (typeof src !== 'string' || src === '') {
              console.error(`     ${file} has an icons[] entry with no src`);
              bad += 1;
              continue;
            }
            // Off-origin and inline icons are the manifest's business, not this build's.
            if (/^(https?:)?\/\//.test(src) || src.startsWith('data:')) continue;
            const onDisk = path.join('dist', src.replace(/^\//, ''));
            if (!fs.existsSync(onDisk)) {
              console.error(`     ${file} references "${src}" but ${onDisk} does not exist`);
              bad += 1;
            }
          }
          if (bad > 0) process.exit(1);
          console.log(`   ✓ dist/site.webmanifest parses; all ${icons.length} declared icon(s) exist in dist`);
          JS
          # Declared as well as present: a favicon.ico alone gets picked up by some crawlers and missed
          # by others, and neither the touch icon nor the manifest is ever requested without a <link>.
          # Scoped to "$pages" — the indexable route pages, which all descend from index.html — rather
          # than every .html: dist/404.html is a standalone redirect shim from public/404.html that
          # nothing indexes and that never renders long enough to want an icon.
          for ref in /favicon.ico /apple-touch-icon.png /site.webmanifest; do
            unref=$( { grep -L -F "$ref" "${pages[@]}" || true; } )
            if [ -n "$unref" ]; then
              echo "$unref" | head -10 | sed 's/^/     /'
              fail "$(echo "$unref" | wc -l | tr -d ' ') page(s) above never declare $ref — add the <link> to index.html"
            fi
            echo "   ✓ all ${#pages[@]} route pages declare $ref"
          done

          echo "── Markup and structured data ───────────────────────────────"
          # One pass over every published page for three defects that all ship silently: structured data
          # a crawler rejects, a heading that renders with nothing in it, and a third-party script on the
          # critical path. Each is reported with the file that carries it.
          sd_checker=$(mktemp)
          cat > "$sd_checker" <<'JS'
          const fs = require('fs');

          const files = process.argv.slice(2);
          const problems = [];

          // prerender.js writes JSON-LD with the closing slash escaped so a "</script" inside a string
          // cannot end the element early; undo that before parsing.
          const LD_JSON = /<script\b[^>]*type\s*=\s*["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
          // Only the opening tag, never a script's body. Analytics and ads are attached after the
          // page has painted by an inline loader that holds their URLs in string literals; those
          // strings are not script elements on the render path and must not read as violations.
          const SCRIPT_TAG = /<script\b[^>]*>/gi;
          const SRC_ATTR = /\ssrc\s*=\s*["']([^"']+)["']/i;
          const EMPTY_HEADING = /<(h[1-6])\b[^>]*>\s*<\/\1>/i;

          function checkFaq(file, node) {
            if (!node || node['@type'] !== 'FAQPage') return;
            const questions = Array.isArray(node.mainEntity) ? node.mainEntity : [];
            if (questions.length === 0) {
              problems.push(`${file}: FAQPage has an empty mainEntity`);
              return;
            }
            questions.forEach((question, index) => {
              const name = question && question.name;
              const answer = question && question.acceptedAnswer && question.acceptedAnswer.text;
              if (typeof name !== 'string' || name.trim() === '') {
                problems.push(`${file}: FAQPage entry ${index + 1} has no question text`);
              }
              if (typeof answer !== 'string' || answer.trim() === '') {
                problems.push(`${file}: FAQPage entry ${index + 1} has no answer text`);
              }
            });
          }

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');

            LD_JSON.lastIndex = 0;
            let match;
            let block = 0;
            while ((match = LD_JSON.exec(html)) !== null) {
              block += 1;
              let data;
              try {
                data = JSON.parse(match[1].replace(/<\\\//g, '</'));
              } catch (error) {
                problems.push(`${file}: JSON-LD block ${block} does not parse (${error.message})`);
                continue;
              }
              for (const node of (Array.isArray(data) ? data : [data])) checkFaq(file, node);
            }

            const empty = EMPTY_HEADING.exec(html);
            if (empty) {
              problems.push(`${file}: renders an empty <${empty[1]}></${empty[1]}>`);
            }

            SCRIPT_TAG.lastIndex = 0;
            while ((match = SCRIPT_TAG.exec(html)) !== null) {
              const src = SRC_ATTR.exec(match[0]);
              if (!src) continue;
              if (/^(https?:)?\/\//i.test(src[1])) {
                problems.push(`${file}: ships an off-origin <script src="${src[1]}"> in the initial HTML`);
              }
            }
          }

          if (problems.length > 0) {
            const unique = [...new Set(problems)];
            for (const problem of unique.slice(0, 40)) console.error(`     ${problem}`);
            if (unique.length > 40) console.error(`     … and ${unique.length - 40} more of the same kind`);
            console.error(`     ${unique.length} problem(s) total`);
            process.exit(1);
          }

          console.log(`   ✓ ${files.length} pages: JSON-LD parses, FAQ entries complete, no empty headings, no off-origin script tags`);
          JS
          node "$sd_checker" "${html_files[@]}" || fail "published markup carries the defects listed above"

          echo "✅ All deployment invariants hold"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
