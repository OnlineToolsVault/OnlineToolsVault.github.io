<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <meta name="robots" content="noindex">

    <!-- The same icon set index.html declares. This page is a noindex redirect shim that a visitor
         sees for a fraction of a second, but it is a real document with a real tab, and without
         these the browser falls back to a generic globe (or re-requests /favicon.ico) on every
         mistyped URL. Keep in step with the block in index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#6E42F0">
    <script>
        // GitHub Pages serves this file (with a 404 status) for any path that has no
        // pre-rendered index.html — i.e. a genuinely unknown URL.
        //
        // It used to redirect straight to "/", which silently dumped people on the homepage with
        // no explanation and left the app's own NotFound route unreachable in production. Instead,
        // hand the requested path to the SPA so React Router can match "*" and render it.
        (function () {
            var base = document.querySelector('base')?.getAttribute('href') || '/';
            var requested = window.location.pathname + window.location.search + window.location.hash;

            if (requested === base || requested === '/') {
                window.location.replace(base);
                return;
            }

            window.location.replace(base + '?notfound=' + encodeURIComponent(requested));
        })();
    </script>
</head>

<body>
    <p>Redirecting to home...</p>
</body>

</html>
