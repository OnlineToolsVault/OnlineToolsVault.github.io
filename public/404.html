<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <meta name="robots" content="noindex">
    <script>
        // GitHub Pages serves this file (with a 404 status) for any path that has no
        // pre-rendered index.html — i.e. a genuinely unknown URL.
        //
        // It used to redirect straight to "/", which silently dumped people on the homepage with
        // no explanation and left the app's own NotFound route unreachable in production. Instead,
        // hand the requested path to the SPA so React Router can match "*" and render it.
        (function () {
            var base = document.querySelector('base')?.getAttribute('href') || '/';
            var requested = window.location.pathname + window.location.search + window.location.hash;

            if (requested === base || requested === '/') {
                window.location.replace(base);
                return;
            }

            window.location.replace(base + '?notfound=' + encodeURIComponent(requested));
        })();
    </script>
</head>

<body>
    <p>Redirecting to home...</p>
</body>

</html>
