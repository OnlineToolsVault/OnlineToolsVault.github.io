  <!--
    Inter, served from this origin.

    This used to be a <link> to fonts.googleapis.com, which made every one of the 89 routes open a
    connection to Google (and then a second one to fonts.gstatic.com) before it could paint text —
    the last off-origin request common to all pages, and one that handed a third party the IP of
    every visitor on a site whose whole pitch is that nothing leaves the browser.

    scripts/copy-runtime-assets.js stages the two woff2 files into public/fonts at build time.
    Change a filename or a unicode-range here and change it there; the script re-checks the ranges
    against what Google serves and warns when they drift.

    These are the *variable* faces (`font-weight: 100 900`), which is what Google was already
    serving: css2 answers `wght@400;500;600;700;800` with the same single file declared five times,
    so all five weights come out of one 48 KB download exactly as before.

    Only latin is preloaded. latin-ext is a further 83 KB that the unicode-range below keeps unread
    unless a page actually contains one of its characters, which no page currently does — preloading
    it would cost every visitor 83 KB for nothing. `crossorigin` is required even though the file is
    same-origin: fonts are always fetched in CORS mode, and without it the preload is discarded and
    the file downloaded twice.
  -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
  </style>

  <!--
    Retire the old COOP/COEP service worker.

    It was added for SharedArrayBuffer, but the FFmpeg tools load the single-threaded
    @ffmpeg/core build, which never touches SharedArrayBuffer — verified by running a
    conversion with crossOriginIsolated === false. Meanwhile cross-origin isolation blocked
    every third-party image a user pastes into the Markdown Previewer, and forced a full page
    reload on each visitor's first page view.

    Returning visitors still have the worker installed and would keep getting the COEP headers
    forever, so unregister it once and reload to drop out of the isolated context.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        var removed = false;
        for (var i = 0; i < registrations.length; i++) {
          var url = (registrations[i].active && registrations[i].active.scriptURL) || '';
          if (url.indexOf('coi-serviceworker') !== -1) {
            registrations[i].unregister();
            removed = true;
          }
        }
        if (removed && window.crossOriginIsolated) window.location.reload();
      }).catch(function () { /* nothing to clean up */ });
    })();
  </script>

  <!--
    Restore the URL that 404.html forwarded here, before React Router reads location.
    GitHub Pages cannot rewrite unknown paths itself, so 404.html bounces them to
    /?notfound=<path>; putting the real path back lets the app's "*" route render NotFound
    at the address the visitor actually typed.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get('notfound');
        if (requested && requested.charAt(0) === '/' && requested.charAt(1) !== '/') {
          window.history.replaceState(null, '', requested);
        }
      } catch (error) {
        console.error('[NotFound Restore] Error:', error);
      }
    })();
  </script>

  <!-- Smart Hash URL Redirect (handles legacy #/ URLs) -->
  <script>
    (function () {
      try {
        var hash = window.location.hash;

        // Check if this is a hash-based route (e.g., #/word-counter)
        if (hash && hash.startsWith('#/')) {
          var path = hash.slice(2); // Remove '#/'
          var search = window.location.search || '';

          // A legacy link can carry its own query or fragment inside the hash
          // (#/word-counter?tab=2). Split that off before the path is touched, otherwise the
          // trailing slash below lands after the query string and produces "word-counter?tab=2/".
          var extra = '';
          var cut = path.search(/[?#]/);
          if (cut !== -1) {
            extra = path.slice(cut);
            path = path.slice(0, cut);
          }
          // Two query strings concatenated would give "?a=1?b=2"; the second '?' becomes '&'.
          if (search && extra.charAt(0) === '?') extra = '&' + extra.slice(1);

          // Auto-detect base path (works in dev and production)
          // In dev: localhost:5173 → base = '/'
          // In prod: .../Free-Tools → base = '/Free-Tools/'
          var base = document.querySelector('base')?.getAttribute('href') || '/';

          // If no base tag, check current path for /Free-Tools/
          if (base === '/' && window.location.pathname.includes('/Free-Tools/')) {
            base = '/Free-Tools/';
          }

          // Clean up the path (remove trailing/leading slashes)
          path = path.replace(/^\/+|\/+$/g, '');

          // Build redirect URL.
          //
          // The trailing slash is not cosmetic. GitHub Pages serves each route from
          // dist/<route>/index.html, so /word-counter answers with a 301 to /word-counter/ —
          // meaning the slash-less form this used to emit turned every legacy hash link into two
          // navigations, and any of them that ended up in a canonical, a sitemap or an inbound
          // link pointed at the redirecting URL rather than the real one. Every other internal
          // link on the site was normalised to the trailing-slash form; this was the last hole.
          var redirectUrl;
          if (path) {
            redirectUrl = base + path + '/' + search + extra;
          } else {
            // Just '#/' with no path - go to home
            redirectUrl = base + search + extra;
          }

          // Redirect using replace (doesn't add to history)
          window.location.replace(redirectUrl);
        }
      } catch (error) {
        // Silently fail - the app will load normally
        console.error('[Hash Redirect] Error:', error);
      }
    })();
  </script>
