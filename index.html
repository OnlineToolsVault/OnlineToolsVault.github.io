<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Icons.

    The files live in public/ and are copied to the site root verbatim, so every href here is an
    absolute path from the root and stays correct on the deep routes (/merge-pdf/, /pdf-to-word/)
    where a relative href would resolve one directory too far down.

    - favicon.ico is the multi-size fallback browsers and crawlers request at the fixed
      /favicon.ico address whether or not it is declared. `sizes="any"` marks it as the
      resolution-independent entry so a browser that also understands the PNGs below prefers those.
    - favicon-32.png is the tab icon, favicon-192.png the Android home-screen icon and
      favicon-512.png the large icon used for install prompts and as the Organization logo in the
      structured data further down.
    - apple-touch-icon.png is what iOS uses for "Add to Home Screen"; it must be a non-transparent
      180x180 PNG, since iOS composites nothing behind it.
    - site.webmanifest names the app for installability. It is same-origin, so no `crossorigin`.

    theme-color is the resolved value of the `--primary` token in src/index.css, and it must stay
    equal to `theme_color` in public/site.webmanifest — the two colour the same browser chrome from
    different sources, and disagreeing is a reported defect rather than a fallback.
  -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#6E42F0" />
  <title>Free Online Tools - PDF, Image & Utility Tools | OnlineToolsVault</title>
  <meta name="description"
    content="100% Free, Secure, and Client-Side Online Tools for PDF, Images, and more. No file uploads to servers, everything happens in your browser." />

  <!-- SEO & Social Meta Tags -->
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Free Online Tools - PDF, Image & Utility Tools" />
  <meta property="og:description"
    content="100% Free, Secure, and Client-Side Online Tools for PDF, Images, and more. Privacy focused." />
  <meta property="og:url" content="https://onlinetoolsvault.com/" />
  <meta property="og:site_name" content="OnlineToolsVault" />
  <meta property="og:image" content="https://onlinetoolsvault.com/og/default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OnlineToolsVault — Free Online Tools" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@sourcestrongai" />
  <meta name="twitter:title" content="Free Online Tools - PDF, Image & Utility Tools" />
  <meta name="twitter:description"
    content="100% Free, Secure, and Client-Side Online Tools for PDF, Images, and more." />
  <meta name="twitter:image" content="https://onlinetoolsvault.com/og/default.png" />
  <meta name="twitter:image:alt" content="OnlineToolsVault — Free Online Tools" />
  <meta name="twitter:creator" content="@sourcestrongai" />

  <!--
    Structured Data (JSON-LD) — the SITE-LEVEL graph, and nothing else.

    generate-sitemap.js copies this file to dist/<route>/index.html for every route and only
    rewrites title/description/canonical/og/twitter, so whatever sits here ships on every page
    unchanged. That is exactly right for Organization and WebSite — they describe the site, not the
    document — and exactly wrong for a page entity.

    This block used to be a WebApplication whose "url" was the homepage. Because it shipped
    verbatim on every page, each tool page declared the homepage as its primary entity, so no
    tool page described itself at all. The per-page entity now comes from
    src/components/tools/ToolLayout.jsx, which emits a SoftwareApplication pointing at that page's
    own canonical, plus a BreadcrumbList and the FAQPage. Do not reintroduce a page-scoped type
    here: two primary entities on one document is worse than none.

    The @id values are what tie the two together and let the per-page nodes reference the publisher
    without restating it.

    No potentialAction/SearchAction. A SearchAction has to name a URL template that really performs
    a search, and this site has none — the home page filters an already-loaded list in component
    state, with no query parameter and no /search route (checked against src/App.jsx). Declaring
    one anyway would be a claim Google can, and does, test.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://onlinetoolsvault.com/#organization",
          "name": "OnlineToolsVault",
          "url": "https://onlinetoolsvault.com/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://onlinetoolsvault.com/#logo",
            "url": "https://onlinetoolsvault.com/favicon-512.png",
            "contentUrl": "https://onlinetoolsvault.com/favicon-512.png",
            "width": 512,
            "height": 512,
            "caption": "OnlineToolsVault"
          },
          "image": {
            "@id": "https://onlinetoolsvault.com/#logo"
          },
          "sameAs": [
            "https://github.com/OnlineToolsVault",
            "https://x.com/sourcestrongai",
            "https://www.linkedin.com/company/sourcestrongai"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://onlinetoolsvault.com/#website",
          "name": "OnlineToolsVault",
          "url": "https://onlinetoolsvault.com/",
          "description": "Free, client-side tools for PDF, image, text, developer and security tasks. Files are processed in the browser and never uploaded.",
          "inLanguage": "en",
          "publisher": {
            "@id": "https://onlinetoolsvault.com/#organization"
          }
        }
      ]
    }
  </script>

  <!--
    Inter, served from this origin.

    This used to be a <link> to fonts.googleapis.com, which made every route open a connection
    to Google (and then a second one to fonts.gstatic.com) before it could paint text — the last
    off-origin request common to all pages, and one that handed a third party the IP of every
    visitor on a site whose whole pitch is that nothing leaves the browser.

    The two woff2 files are git-tracked under public/fonts. If a face or unicode-range here ever
    changes, refresh those files by hand from a locally downloaded copy of the font.

    These are the *variable* faces (`font-weight: 100 900`), which is what Google was already
    serving: css2 answers `wght@400;500;600;700;800` with the same single file declared five times,
    so all five weights come out of one 48 KB download exactly as before.

    Only latin is preloaded. latin-ext is a further 83 KB that the unicode-range below keeps unread
    unless a page actually contains one of its characters, which no page currently does — preloading
    it would cost every visitor 83 KB for nothing. `crossorigin` is required even though the file is
    same-origin: fonts are always fetched in CORS mode, and without it the preload is discarded and
    the file downloaded twice.
  -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
  </style>

  <!--
    Analytics & Ads — requested after first paint, not from the document head.

    Both of these used to be async script tags right here. "async" only means "do not block
    parsing"; it does nothing about the bandwidth, connection slots and main-thread time the two
    scripts take, and both were being fetched and executed in the same window the browser needed to
    render and lay out the largest element. Together they are the biggest third-party payload the
    site loads, and they were arriving before any of the page a visitor came for.

    So the loading is moved behind the load event and then an idle callback: nothing here competes
    with first paint or with the work that follows it, and both scripts still end up in the
    document doing exactly what they did before.

    The gtag command queue stays inline and eager on purpose. It is a three-line stub with no
    network cost, and `dataLayer` is a queue by design — the `js` and `config` commands pushed here
    sit in the array until the real tag script arrives and replays them, so the page_view is still
    recorded with the URL, title and referrer the visitor actually landed on. Removing the stub and
    configuring after load instead would lose any event fired in between.

    The AdSense loader is unconditional in the same way it was before: nothing in src/ calls
    `adsbygoogle.push`, so this tag exists for account verification and Auto Ads, neither of which
    cares when in the page lifecycle it runs.

    requestIdleCallback gets a timeout so a page that never goes idle (an editor route with a
    busy main thread) still loads them; browsers without it fall back to a plain timer.

    scripts/prerender.js sets window.__PRERENDER__ and blocks every third-party request, so the
    build would only fire two requests that are immediately aborted. Skip the whole thing there.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-EVGNTG49J7');

    (function () {
      if (window.__PRERENDER__) return;

      var deferred = [
        { src: 'https://www.googletagmanager.com/gtag/js?id=G-EVGNTG49J7' },
        {
          src: 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4988388949365963',
          crossOrigin: 'anonymous'
        }
      ];

      var started = false;
      function loadDeferred() {
        if (started) return;
        started = true;
        for (var i = 0; i < deferred.length; i++) {
          var script = document.createElement('script');
          script.async = true;
          if (deferred[i].crossOrigin) script.crossOrigin = deferred[i].crossOrigin;
          script.src = deferred[i].src;
          document.head.appendChild(script);
        }
      }

      function scheduleAfterPaint() {
        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(loadDeferred, { timeout: 3000 });
        } else {
          window.setTimeout(loadDeferred, 1500);
        }
      }

      if (document.readyState === 'complete') {
        scheduleAfterPaint();
      } else {
        window.addEventListener('load', scheduleAfterPaint, { once: true });
      }
    })();
  </script>

  <!--
    Retire the old COOP/COEP service worker.

    It was added for SharedArrayBuffer, but the FFmpeg tools load the single-threaded
    @ffmpeg/core build, which never touches SharedArrayBuffer — verified by running a
    conversion with crossOriginIsolated === false. Meanwhile cross-origin isolation blocked
    every third-party image a user pastes into the Markdown Previewer, and forced a full page
    reload on each visitor's first page view.

    Returning visitors still have the worker installed and would keep getting the COEP headers
    forever, so unregister it once and reload to drop out of the isolated context.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        var removed = false;
        for (var i = 0; i < registrations.length; i++) {
          var url = (registrations[i].active && registrations[i].active.scriptURL) || '';
          if (url.indexOf('coi-serviceworker') !== -1) {
            registrations[i].unregister();
            removed = true;
          }
        }
        if (removed && window.crossOriginIsolated) window.location.reload();
      }).catch(function () { /* nothing to clean up */ });
    })();
  </script>

  <!--
    Restore the URL that 404.html forwarded here, before React Router reads location.
    GitHub Pages cannot rewrite unknown paths itself, so 404.html bounces them to
    /?notfound=<path>; putting the real path back lets the app's "*" route render NotFound
    at the address the visitor actually typed.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get('notfound');
        if (requested && requested.charAt(0) === '/' && requested.charAt(1) !== '/') {
          window.history.replaceState(null, '', requested);
        }
      } catch (error) {
        console.error('[NotFound Restore] Error:', error);
      }
    })();
  </script>

  <!-- Smart Hash URL Redirect (handles legacy #/ URLs) -->
  <script>
    (function () {
      try {
        var hash = window.location.hash;

        // Check if this is a hash-based route (e.g., #/word-counter)
        if (hash && hash.startsWith('#/')) {
          var path = hash.slice(2); // Remove '#/'
          var search = window.location.search || '';

          // A legacy link can carry its own query or fragment inside the hash
          // (#/word-counter?tab=2). Split that off before the path is touched, otherwise the
          // trailing slash below lands after the query string and produces "word-counter?tab=2/".
          var extra = '';
          var cut = path.search(/[?#]/);
          if (cut !== -1) {
            extra = path.slice(cut);
            path = path.slice(0, cut);
          }
          // Two query strings concatenated would give "?a=1?b=2"; the second '?' becomes '&'.
          if (search && extra.charAt(0) === '?') extra = '&' + extra.slice(1);

          // The site is served from the root of a domain — onlinetoolsvault.com via dist/CNAME,
          // and the OnlineToolsVault.github.io user-pages root — so this is '/' in production
          // and in dev. Honour a <base href> if one is ever added; do not sniff the pathname.
          var base = document.querySelector('base')?.getAttribute('href') || '/';

          // Clean up the path (remove trailing/leading slashes)
          path = path.replace(/^\/+|\/+$/g, '');

          // Build redirect URL.
          //
          // The trailing slash is not cosmetic. GitHub Pages serves each route from
          // dist/<route>/index.html, so /word-counter answers with a 301 to /word-counter/ —
          // meaning the slash-less form this used to emit turned every legacy hash link into two
          // navigations, and any of them that ended up in a canonical, a sitemap or an inbound
          // link pointed at the redirecting URL rather than the real one. Every other internal
          // link on the site was normalised to the trailing-slash form; this was the last hole.
          var redirectUrl;
          if (path) {
            redirectUrl = base + path + '/' + search + extra;
          } else {
            // Just '#/' with no path - go to home
            redirectUrl = base + search + extra;
          }

          // Redirect using replace (doesn't add to history)
          window.location.replace(redirectUrl);
        }
      } catch (error) {
        // Silently fail - the app will load normally
        console.error('[Hash Redirect] Error:', error);
      }
    })();
  </script>
</head>
